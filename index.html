<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        ios: { bg: '#F5F5F7', card: '#FFFFFF', blue: '#007AFF', red: '#FF3B30', green: '#34C759', gray: '#8E8E93' }
                    },
                    boxShadow: { 'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)' }
                }
            }
        }
    </script>

    <style>
        body { background-color: #F5F5F7; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .glass-dark { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .active-scale:active { transform: scale(0.96); transition: transform 0.1s; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        /* Smooth Transitions */
        .card-anim { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .card-anim:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
        
        /* Toggle Switch */
        .toggle-checkbox:checked { right: 0; border-color: #34C759; }
        .toggle-checkbox:checked + .toggle-label { background-color: #34C759; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-100">

    <div id="authScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#F5F5F7] p-6">
        <div class="w-full max-w-sm text-center">
            <div class="w-16 h-16 bg-white rounded-2xl shadow-xl flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-shield-halved text-2xl text-slate-700"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">Admin Console</h1>
            <p class="text-slate-400 text-sm mb-8">Enter Master PIN to access</p>
            
            <div class="flex justify-center gap-3 mb-8">
                <input type="password" id="adminPin" placeholder="••••" maxlength="4" 
                    class="w-full text-center text-3xl tracking-[1em] font-bold py-4 rounded-2xl border-none shadow-glass focus:ring-0 bg-white placeholder-slate-200">
            </div>
            <button onclick="checkAdmin()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-semibold shadow-lg active-scale">Unlock</button>
        </div>
    </div>

    <div id="dashboard" class="hidden min-h-screen pb-24">
        <header class="fixed top-0 w-full glass z-40 px-6 py-4 flex justify-between items-center shadow-sm">
            <div>
                <h1 class="text-lg font-bold">Staff Access</h1>
                <p class="text-[11px] text-slate-400 font-medium tracking-wide uppercase">Control Panel</p>
            </div>
            <button onclick="toggleAddModal(true)" class="w-9 h-9 bg-slate-900 text-white rounded-full flex items-center justify-center shadow-lg active-scale">
                <i class="fa-solid fa-plus"></i>
            </button>
        </header>

        <div class="mt-24 px-6 mb-6">
            <div class="flex gap-4 overflow-x-auto hide-scroll pb-2">
                <div class="min-w-[140px] glass p-4 rounded-2xl shadow-sm">
                    <p class="text-xs text-slate-400 font-semibold uppercase">Total Users</p>
                    <p class="text-2xl font-bold mt-1" id="statTotal">0</p>
                </div>
                <div class="min-w-[140px] glass p-4 rounded-2xl shadow-sm">
                    <p class="text-xs text-slate-400 font-semibold uppercase">Active Now</p>
                    <p class="text-2xl font-bold text-green-500 mt-1" id="statActive">0</p>
                </div>
            </div>
        </div>

        <main class="px-6">
            <h2 class="text-sm font-semibold text-slate-400 mb-4 ml-1">REGISTERED STAFF</h2>
            <div id="usersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="flex flex-col items-center justify-center py-10 text-slate-400">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
                    <span class="text-xs">Loading Staff...</span>
                </div>
            </div>
        </main>
    </div>

    <div id="addModal" class="fixed inset-0 z-50 hidden glass-dark flex items-end sm:items-center justify-center sm:p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full sm:max-w-md rounded-t-[32px] sm:rounded-[32px] p-8 shadow-2xl transform translate-y-full transition-transform duration-300" id="modalPanel">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">New Staff</h2>
                <button onclick="toggleAddModal(false)" class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 active-scale"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Username (ID)</label>
                    <input type="text" id="newUsername" placeholder="e.g. staff_rahul" class="w-full bg-slate-50 border-none rounded-xl px-4 py-3.5 font-medium focus:ring-2 focus:ring-slate-200 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Password</label>
                    <input type="text" id="newPassword" placeholder="e.g. 12345" class="w-full bg-slate-50 border-none rounded-xl px-4 py-3.5 font-medium focus:ring-2 focus:ring-slate-200 outline-none">
                </div>
                <button onclick="createNewUser()" class="w-full bg-ios-blue text-white py-4 rounded-xl font-bold text-lg shadow-lg shadow-blue-200 active-scale mt-4">
                    Create Access
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs font-semibold px-6 py-3 rounded-full shadow-xl z-[60] transition-all duration-300 opacity-0 -translate-y-10 pointer-events-none flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-green-400"></i>
        <span id="toastMsg">Action Successful</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // --- PASTE YOUR FIREBASE CONFIG HERE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCFFqmKe5xDdh4TghUFzxw5Jiq9wSthW6E",
            authDomain: "granicer-cutting-department.firebaseapp.com",
            projectId: "granicer-cutting-department",
            storageBucket: "granicer-cutting-department.firebasestorage.app",
            messagingSenderId: "341952298256",
            appId: "1:341952298256:web:e0abaed956851da27e7995"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const usersCollection = collection(db, "users");

        // --- ADMIN LOGIC ---
        window.checkAdmin = function() {
            const pin = document.getElementById('adminPin').value;
            // HARDCODED MASTER PIN: 1234 (Change this if you want)
            if(pin === '1234') {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadUsers();
            } else {
                showToast('Wrong PIN', true);
                document.getElementById('adminPin').value = '';
                // Vibrate for error
                if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
            }
        }

        function loadUsers() {
            onSnapshot(usersCollection, (snapshot) => {
                const grid = document.getElementById('usersGrid');
                const users = [];
                snapshot.forEach(doc => users.push({ ...doc.data(), id: doc.id }));
                
                // Update Stats
                document.getElementById('statTotal').innerText = users.length;
                document.getElementById('statActive').innerText = users.filter(u => !u.isBlocked).length;

                if(users.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400">No staff added yet. Tap + to add.</div>`;
                    return;
                }

                grid.innerHTML = users.map(user => {
                    const isBlocked = user.isBlocked || false;
                    const hasDevice = user.deviceId ? true : false;
                    const statusColor = isBlocked ? 'bg-red-500' : 'bg-green-500';
                    const statusText = isBlocked ? 'Blocked' : 'Active';
                    const deviceStatus = hasDevice ? '<span class="text-ios-blue"><i class="fa-solid fa-mobile-screen"></i> Linked</span>' : '<span class="text-slate-400">No Device</span>';

                    return `
                    <div class="glass p-5 rounded-3xl card-anim relative overflow-hidden group">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="font-bold text-lg text-slate-800">${user.username}</h3>
                                <p class="text-xs font-mono text-slate-400 mt-0.5">Pass: ${user.password}</p>
                            </div>
                            <div class="w-8 h-8 rounded-full ${isBlocked ? 'bg-red-50 text-red-500' : 'bg-green-50 text-green-500'} flex items-center justify-center text-xs">
                                <i class="fa-solid ${isBlocked ? 'fa-lock' : 'fa-lock-open'}"></i>
                            </div>
                        </div>

                        <div class="flex items-center justify-between bg-white/50 rounded-xl p-3 mb-4">
                            <div class="text-xs font-semibold">
                                ${deviceStatus}
                            </div>
                            ${hasDevice ? `
                                <button onclick="resetDevice('${user.id}', '${user.username}')" class="text-[10px] font-bold bg-ios-blue/10 text-ios-blue px-3 py-1.5 rounded-full hover:bg-ios-blue hover:text-white transition-colors">
                                    RESET ID
                                </button>
                            ` : ''}
                        </div>

                        <div class="flex gap-2">
                            <button onclick="toggleBlock('${user.id}', ${isBlocked})" class="flex-1 py-3 rounded-xl text-xs font-bold transition-colors ${isBlocked ? 'bg-slate-900 text-white' : 'bg-red-50 text-red-500 hover:bg-red-100'}">
                                ${isBlocked ? 'Unblock Access' : 'Block User'}
                            </button>
                            <button onclick="deleteUser('${user.id}')" class="w-10 flex items-center justify-center rounded-xl bg-gray-100 text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    `;
                }).join('');
            });
        }

        window.createNewUser = async function() {
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value.trim();

            if(!username || !password) { showToast('Fill all fields', true); return; }

            try {
                await addDoc(usersCollection, {
                    username: username,
                    password: password,
                    deviceId: null, // Initially null
                    isBlocked: false,
                    createdAt: serverTimestamp()
                });
                toggleAddModal(false);
                document.getElementById('newUsername').value = '';
                document.getElementById('newPassword').value = '';
                showToast('Staff Added Successfully');
            } catch (error) {
                console.error(error);
                showToast('Error adding staff', true);
            }
        }

        window.toggleBlock = async function(docId, currentStatus) {
            try {
                await updateDoc(doc(db, "users", docId), {
                    isBlocked: !currentStatus,
                    deviceId: null // Optional: Block karte hi device bhi kick kar do
                });
                showToast(currentStatus ? 'User Unblocked' : 'User Blocked');
            } catch(e) { console.error(e); }
        }

        window.resetDevice = async function(docId, name) {
            if(!confirm(`Reset device lock for ${name}?`)) return;
            try {
                await updateDoc(doc(db, "users", docId), {
                    deviceId: null
                });
                showToast('Device ID Reset');
            } catch(e) { console.error(e); }
        }

        window.deleteUser = async function(docId) {
            if(!confirm("Are you sure? This cannot be undone.")) return;
            try {
                await deleteDoc(doc(db, "users", docId));
                showToast('User Deleted');
            } catch(e) { console.error(e); }
        }

        // UI HELPERS
        window.toggleAddModal = function(show) {
            const modal = document.getElementById('addModal');
            const panel = document.getElementById('modalPanel');
            if(show) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    panel.classList.remove('translate-y-full');
                }, 10);
            } else {
                panel.classList.add('translate-y-full');
                modal.classList.add('opacity-0');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        window.showToast = function(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.firstElementChild.className = isError ? "fa-solid fa-circle-exclamation text-red-400" : "fa-solid fa-circle-check text-green-400";
            
            toast.classList.remove('opacity-0', '-translate-y-10');
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-10');
            }, 3000);
        }
    </script>
</body>
</html>
